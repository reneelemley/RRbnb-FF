<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#FFFFFF" />
<title>Book a stay · The R&amp;R BnB</title>
<meta name="description" content="See what's open and request your dates. A modest nightly rate covers cleaning and expenses." />
<link rel="icon" href="../assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;--linen:#F3F8F9;--linen-2:#E6F0F2;--sand:#D5E6EA;--sand-2:#BFD6DC;--card:#FFFFFF;
    --ink:#182A3A;--ink-2:#4A5D6C;--ink-3:#8495A2;--stone:#12263A;--stone-2:#1C3550;
    --gold:#A9823C;--gold-2:#C6A15A;--gold-soft:#EFE4CE;--line:#E1EAEE;
    --sea:#1B8494;--sea-2:#2A9DAB;--sea-soft:#DDF0F1;
    --grad-sea:linear-gradient(103deg,#2A9DAB 0%,#1B8494 60%,#14636F 120%);
    --grad-gold:linear-gradient(103deg,#C6A15A 0%,#A9823C 60%,#8A6B2E 120%);
    --disp:'Fraunces',Georgia,serif;--ui:'Inter',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
    --mx:1180px;--ease:cubic-bezier(.2,.8,.2,1);
    --shadow:0 2px 10px rgba(18,38,58,.04),0 22px 50px rgba(18,38,58,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{font-family:var(--ui);font-size:18px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  img,svg{display:block;max-width:100%;}a{color:inherit;}
  .wrap{max-width:var(--mx);margin:0 auto;padding:0 clamp(20px,5vw,48px);position:relative;}
  h1,h2,h3{margin:0;font-family:var(--disp);font-weight:400;letter-spacing:-.01em;line-height:1.08;color:var(--ink);}
  .h1{font-size:clamp(40px,5.6vw,70px);}
  .lead{font-size:clamp(18px,1.5vw,21px);color:var(--ink-2);line-height:1.6;}
  .italic{font-style:italic;}.gold-text{color:var(--gold);}
  .eyebrow{font-family:var(--ui);font-weight:600;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:inline-flex;align-items:center;gap:14px;}
  .eyebrow::before,.eyebrow::after{content:"";width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));}
  .btn{display:inline-flex;align-items:center;gap:11px;font-family:var(--ui);font-weight:600;font-size:15px;padding:15px 28px;border-radius:2px;text-decoration:none;border:0;cursor:pointer;transition:transform .22s var(--ease),box-shadow .22s,border-color .2s,color .2s;white-space:nowrap;}
  .btn-solid{background:var(--stone);color:#F4F7F9;}.btn-solid:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(18,38,58,.24);}
  .btn-gold{background:var(--grad-sea);color:#fff;}.btn-gold:hover{transform:translateY(-2px);}
  .btn-line{background:transparent;color:var(--ink);border:1px solid var(--line);}.btn-line:hover{border-color:var(--gold);color:var(--gold);}

  .nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--line);}
  .nav-in{max-width:var(--mx);margin:0 auto;padding:14px clamp(20px,5vw,48px);display:flex;align-items:center;gap:16px;}
  .nav-brand{display:flex;align-items:center;gap:11px;text-decoration:none;}
  .nav-brand .word{font-family:var(--disp);font-style:italic;font-size:22px;color:var(--ink);}
  .nav-brand .word .gold-text{font-style:italic;}
  .nav-back{margin-left:auto;font-family:var(--ui);font-weight:500;font-size:14px;color:var(--ink-2);text-decoration:none;}

  .head{padding:clamp(52px,7vw,92px) 0 0;text-align:center;}
  .head .h1{margin-top:18px;}.head .lead{margin:20px auto 0;max-width:54ch;}

  .facts{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 26px;margin:30px auto 0;font-family:var(--ui);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);}
  .facts span{display:inline-flex;align-items:center;}
  .facts span+span::before{content:"◆";color:var(--gold);font-size:8px;margin-right:26px;}

  .rate{max-width:560px;margin:38px auto 0;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:34px 32px;text-align:center;box-shadow:var(--shadow);}
  .rate .r-lbl{font-family:var(--ui);font-weight:600;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);}
  .rate .r-amt{font-family:var(--disp);font-size:clamp(32px,4.4vw,46px);margin:10px 0 6px;color:var(--ink);}
  .rate .r-amt small{font-family:var(--ui);font-weight:500;font-size:15px;color:var(--ink-3);}
  .rate p{font-family:var(--ui);font-size:14.5px;color:var(--ink-2);margin:8px 0 0;line-height:1.6;}

  .cal-shell{margin:38px auto 0;max-width:920px;background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);overflow:hidden;}
  .cal-shell iframe{display:block;width:100%;height:620px;border:0;}
  .cal-empty{padding:64px 30px;text-align:center;color:var(--ink-3);font-family:var(--ui);font-size:15px;line-height:1.7;background:linear-gradient(135deg,var(--linen-2),var(--sand));}
  .book-row{max-width:920px;margin:28px auto 0;text-align:center;}
  .book-row .btn{margin:6px;}
  .legend{font-family:var(--ui);font-size:14px;color:var(--ink-2);margin-top:20px;text-align:center;max-width:60ch;margin-left:auto;margin-right:auto;line-height:1.6;}

  footer{background:var(--stone);color:#9FB1C2;padding:44px 0 32px;margin-top:clamp(64px,8vw,116px);}
  .foot-in{max-width:var(--mx);margin:0 auto;padding:0 clamp(20px,5vw,48px);font-family:var(--ui);font-size:12px;letter-spacing:.06em;color:#7A8EA1;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .foot-in a{color:#B5C4D2;text-decoration:none;}
  .nav-brand .word{display:inline-flex;align-items:center;gap:6px;}
  .brand-rr{height:48px;width:auto;margin:-10px 0;display:inline-block;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a href="../index.html" class="nav-brand" aria-label="The R&amp;R BnB"><span class="word">The <img class="brand-rr" src="../assets/logo-rr.png" alt="R&amp;R" width="80" height="48" /> BnB</span></a>
    <a href="../index.html" class="nav-back">← Back to the villa</a>
  </div>
</nav>

<section>
  <div class="wrap head" style="text-align:center;padding:clamp(70px,10vw,140px) 0 clamp(40px,6vw,80px);">
    <span class="eyebrow">Friends of friends</span>
    <h1 class="h1" style="margin-top:20px;">Guest booking is <span class="italic gold-text">coming soon.</span></h1>
    <p class="lead" style="margin:22px auto 0;max-width:46ch;">We're getting this ready. If you're family or a friend with a personal code, you can request your dates now.</p>
    <p style="margin-top:34px;"><a class="btn btn-solid" href="../stay/">Family &amp; friends <span class="arw">→</span></a></p>
  </div>
</section>

<footer>
  <div class="foot-in">
    <span>© 2026 The R&amp;R BnB · Sint Maarten</span>
  </div>
</footer>
</body>
</html>
