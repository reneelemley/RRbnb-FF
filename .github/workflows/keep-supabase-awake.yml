# Supabase pauses free projects after about a week with no activity.
# This pings the booking calendar twice a week so it never goes to sleep.
name: Keep booking calendar awake
on:
  schedule:
    - cron: "17 13 * * 1,4"   # Mondays and Thursdays, 13:17 UTC
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://afzgfurnffcnqxaaemxd.supabase.co/rest/v1/rpc/calendar" \
            -H "apikey: sb_publishable_50H5hXWrNc-zLhO-Gm41qw_vUWOAh3f" \
            -H "Content-Type: application/json" -d '{}')
          echo "Supabase answered $code"
          test "$code" = "200"
